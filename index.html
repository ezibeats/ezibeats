<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZIBEATS_ARCHIVE_v01</title>
    <style>
        #bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('VC-01.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
            transition: filter 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.is-previewing #bg-overlay {
            filter: blur(20px) brightness(0.4);
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: "Helvetica", "Arial", sans-serif;
            margin: 0;
            padding: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 { font-size: 16px; border-bottom: 2px solid #fff; padding-bottom: 10px; margin-bottom: 40px; }

        .album-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            background-color: #fff;
            border: 2px solid #fff;
        }

        .album {
            background-color: #000;
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            transition: opacity 0.5s ease;
            opacity: 0.4;
        }

        .album:hover { opacity: 1 !important; z-index: 10; }
        .album-grid:hover .album:not(:hover) { opacity: 0.05; }
        .album img { width: 100%; height: 100%; object-fit: cover; }

        .album-info {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .album:hover .album-info { opacity: 1; }

        h2 { font-size: 12px; margin: 0 0 10px 0; border-bottom: 1px solid #fff; padding-bottom: 5px; }
        
        .tracklist { list-style: none; padding: 0; margin: 0; flex-grow: 1; overflow-y: auto; }
        .tracklist li {
            font-size: 9px;
            padding: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: -1px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tracklist li:hover { background: #fff; color: #000; }

        .status { font-size: 8px; margin-top: 8px; opacity: 0.5; }
    </style>
</head>
<body>

    <div id="bg-overlay"></div>
    <h1>EZIBEATS // AUDIO_ARCHIVE_SYSTEM</h1>

    <div class="album-grid">
        
        <div class="album" onmouseenter="document.body.classList.add('is-previewing')" onmouseleave="stopPreview()">
            <img src="VC-01.jpg">
            <div class="album-info">
                <h2>PROJECT_001</h2>
                <ul class="tracklist">
                    <li onmouseenter="startPreview('2026-03-23_10_43_13 x Untitled (Mashup) (1).mp3')">MASHUP_V1</li>
                    <li onmouseenter="startPreview('2026-03-23_10_43_13 x Untitled (Mashup).mp3')">MASHUP_V2</li>
                    <li onmouseenter="startPreview('Cosmic Slopurtunity.mp3')">COSMIC_SLOP</li>
                </ul>
                <div class="status">PREVIEW_20S</div>
            </div>
        </div>

        <div class="album" onmouseenter="document.body.classList.add('is-previewing')" onmouseleave="stopPreview()">
            <img src="VC-01.jpg">
            <div class="album-info">
                <h2>PROJECT_002</h2>
                <ul class="tracklist">
                    <li onmouseenter="startPreview('Did You Remember Your Pills v1 (1).mp3')">REMEMBER_PILLS_V1</li>
                    <li onmouseenter="startPreview('Did You Remember Your Pills v1.mp3')">REMEMBER_PILLS_V2</li>
                    <li onmouseenter="startPreview('Untitled (Vocals).mp3')">UNTITLED_VOCALS</li>
                </ul>
                <div class="status">PREVIEW_20S</div>
            </div>
        </div>

        <div class="album" onmouseenter="document.body.classList.add('is-previewing')" onmouseleave="stopPreview()">
            <img src="VC-01.jpg">
            <div class="album-info">
                <h2>ALBUM_01</h2>
                <ul class="tracklist">
                    <li onmouseenter="startPreview('Did You Remember Your Pills v1 (1).mp3')">PILLS_ALT</li>
                    <li onmouseenter="startPreview('Untitled (Vocals).mp3')">VOCALS_ONLY</li>
                </ul>
                <div class="status">PREVIEW_20S</div>
            </div>
        </div>

        <div class="album" onmouseenter="document.body.classList.add('is-previewing')" onmouseleave="stopPreview()">
            <img src="VC-01.jpg">
            <div class="album-info">
                <h2>ALBUM_02</h2>
                <ul class="tracklist">
                    <li onmouseenter="startPreview('Cosmic Slopurtunity.mp3')">COSMIC_SLOP</li>
                    <li onmouseenter="startPreview('2026-03-23_10_43_13 x Untitled (Mashup).mp3')">MASHUP_V2</li>
                </ul>
                <div class="status">PREVIEW_20S</div>
            </div>
        </div>

        <div class="album"></div><div class="album"></div><div class="album"></div>
    </div>

    <audio id="global-player" style="display:none;"></audio>

    <script>
        const player = document.getElementById('global-player');
        let timer;

        function startPreview(trackUrl) {
            clearTimeout(timer);
            player.src = trackUrl;
            player.volume = 0;
            player.play();
            
            let vol = 0;
            const fadeIn = setInterval(() => {
                if (vol < 1) { vol += 0.1; player.volume = vol.toFixed(1); }
                else { clearInterval(fadeIn); }
            }, 50);

            timer = setTimeout(() => { fadeOutPlayer(); }, 20000); 
        }

        function stopPreview() {
            document.body.classList.remove('is-previewing');
            fadeOutPlayer();
        }

        function fadeOutPlayer() {
            clearTimeout(timer);
            let vol = player.volume;
            const fadeOut = setInterval(() => {
                if (vol > 0) { vol -= 0.1; player.volume = Math.max(0, vol.toFixed(1)); }
                else { clearInterval(fadeOut); player.pause(); player.src = ""; }
            }, 50);
        }
    </script>
</body>
</html>
