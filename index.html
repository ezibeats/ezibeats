<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EZIBEATS_ARCHIVE_v02</title>
    <style>
        body { background: #000; color: #fff; font-family: Helvetica, Arial, sans-serif; padding: 40px; text-transform: uppercase; }
        .album-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: #fff; border: 2px solid #fff; }
        .album { background: #000; aspect-ratio: 1/1; position: relative; opacity: 0.4; transition: 0.3s; overflow: hidden; }
        .album:hover { opacity: 1; }
        
        /* THE FIX: Added pointer-events so the mouse can reach the tracks */
        .album-info { 
            position: absolute; inset: 0; background: rgba(0,0,0,0.9); 
            padding: 20px; display: flex; flex-direction: column; 
            opacity: 0; transition: 0.2s; pointer-events: none; 
        }
        .album:hover .album-info { opacity: 1; pointer-events: auto; }
        
        .tracklist { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .tracklist li { font-size: 10px; padding: 10px; border-bottom: 1px solid #222; cursor: pointer; }
        .tracklist li:hover { background: #fff; color: #000; }
        
        /* THE FIX: Increased height to 4px for visibility */
        .timer-container { width: 100%; height: 4px; background: #222; margin-top: auto; }
        .timer-bar { width: 0%; height: 100%; background: #fff; }
        
        #unlocker { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

    <div id="unlocker" onclick="this.style.display='none';">
        <div style="border: 1px solid #fff; padding: 20px;">[ INITIALIZE_SYSTEM ]</div>
    </div>

    <h1>EZIBEATS // ARCHIVE_V02</h1>

    <div class="album-grid">
        <div class="album" onmouseleave="stopPreview()">
            <div class="album-info">
                <h2>PROJECT_001</h2>
                <ul class="tracklist">
                    <li onmouseenter="startPreview('test1.mp3', this)">TEST_01</li>
                    <li onmouseenter="startPreview('test2.mp3', this)">TEST_02</li>
                    <li onmouseenter="startPreview('test3.mp3', this)">TEST_03</li>
                </ul>
                <div class="timer-container"><div class="timer-bar"></div></div>
            </div>
        </div>

        <div class="album" onmouseleave="stopPreview()">
            <div class="album-info">
                <h2>PROJECT_002</h2>
                <ul class="tracklist">
                    <li onmouseenter="startPreview('test4.mp3', this)">TEST_04</li>
                    <li onmouseenter="startPreview('test5.mp3', this)">TEST_05</li>
                    <li onmouseenter="startPreview('test6.mp3', this)">TEST_06</li>
                </ul>
                <div class="timer-container"><div class="timer-bar"></div></div>
            </div>
        </div>
        <div class="album"></div><div class="album"></div><div class="album"></div>
    </div>

    <audio id="global-player"></audio>

    <script>
        const player = document.getElementById('global-player');
        let barInterval;

        function startPreview(file, element) {
            // 1. Reset everything first
            clearInterval(barInterval);
            document.querySelectorAll('.timer-bar').forEach(b => b.style.width = "0%");
            
            // 2. Locate the specific bar for THIS album
            const albumInfo = element.closest('.album-info');
            const timerBar = albumInfo.querySelector('.timer-bar');
            
            // 3. Start Audio
            player.src = './' + file;
            player.play().catch(e => console.log("Audio block/missing"));

            // 4. Force Timer Movement
            let progress = 0;
            barInterval = setInterval(() => {
                progress += 0.5; 
                timerBar.style.width = progress + "%";
                if (progress >= 100) stopPreview();
            }, 100);
        }

        function stopPreview() {
            clearInterval(barInterval);
            player.pause();
            player.src = "";
            document.querySelectorAll('.timer-bar').forEach(b => b.style.width = "0%");
        }
    </script>
</body>
</html>
