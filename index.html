<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZIBEATS_ARCHIVE</title>
    <style>
        /* --- CORE SYSTEM --- */
        body, html { 
            margin: 0; padding: 0; background: #000; color: #fff; 
            font-family: 'Courier New', monospace; height: 100%; width: 100%;
            overflow: hidden; 
        }

        /* --- 3/3 VERTICAL LANDING --- */
        #landing-page {
            display: flex; flex-direction: column;
            height: 100vh; width: 100vw;
            position: fixed; top: 0; left: 0; z-index: 2000;
            transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        body.view-active #landing-page { transform: translateY(-100%); }

        .section-panel {
            flex: 1; width: 100%;
            display: flex; justify-content: center; align-items: center;
            border-bottom: 1px solid #111;
            cursor: pointer; transition: all 0.5s ease;
            background: #000;
        }

        .nav-btn { 
            font-size: 50px; font-weight: 900; letter-spacing: 15px; 
            color: #111; transition: 0.4s; pointer-events: none; 
            text-transform: uppercase;
        }

        .section-panel:hover { background: #050505; flex: 1.3; }
        .section-panel:hover .nav-btn { color: #ff0000; letter-spacing: 25px; }

        /* --- CONTENT VIEW LOGIC --- */
        .content-view { 
            display: none; width: 100%; min-height: 100vh; 
            flex-direction: column; align-items: center; 
            padding-bottom: 100px; background: #000;
        }
        body.view-music #music-section, 
        body.view-shows #shows-section,
        body.view-merch #merch-section { display: flex; }

        /* --- UI SHARED HEADER --- */
        .ui-header { 
            width: 100%; max-width: 800px; margin: 60px auto 40px; 
            display: flex; justify-content: space-between; 
            border-bottom: 1px solid #222; padding-bottom: 10px; 
        }
        .esc-btn { cursor: pointer; color: #444; font-size: 11px; letter-spacing: 3px; transition: 0.3s; }
        .esc-btn:hover { color: #ff0000; }

        /* --- MUSIC GRID --- */
        .project-card { width: 100%; max-width: 800px; margin-bottom: 40px; }
        .project-title { font-size: 20px; font-weight: 900; letter-spacing: 8px; color: #fff; margin-bottom: 5px; }
        .project-meta { font-size: 9px; color: #ff0000; letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; }
        
        .track-row { 
            padding: 18px 10px; border-bottom: 1px solid #111; 
            display: flex; justify-content: space-between; 
            color: #444; cursor: pointer; font-size: 11px; transition: 0.2s;
        }
        .track-row:hover { color: #fff; background: #050505; }
        .decrypt-tag { color: #222; font-size: 9px; }
        .track-row:hover .decrypt-tag { color: #ff0000; }
        .playing-now { color: #ff0000 !important; border-left: 2px solid #ff0000; padding-left: 20px; }

        /* --- SHOWS: RED-DATE ACCORDION --- */
        .log-container { width: 100%; max-width: 800px; }
        .year-group { border-bottom: 1px solid #111; width: 100%; }
        .year-header { 
            padding: 30px 10px; cursor: pointer; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .year-num { font-size: 24px; font-weight: 900; color: #1a1a1a; letter-spacing: 5px; transition: 0.4s; }
        .year-group.active .year-num { color: #ff0000; letter-spacing: 12px; }
        
        .year-content { 
            max-height: 0; opacity: 0; overflow: hidden; 
            transition: max-height 0.8s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.4s; 
        }
        .year-group.active .year-content { max-height: 3000px; opacity: 1; padding-bottom: 40px; }

        .calendar-table { width: 100%; border-collapse: collapse; }
        .calendar-table td { padding: 15px 10px; color: #444; font-size: 10px; text-transform: uppercase; border-bottom: 1px solid #080808; }
        .date-cell { color: #ff0000 !important; font-weight: 900; width: 100px; }
        .location-cell { text-align: right; opacity: 0.3; font-size: 8px; }
    </style>
</head>
