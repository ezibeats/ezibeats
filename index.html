<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MUSIC_ARCHIVE_v02.1</title>
    <style>
        /* BASE SYSTEM */
        body { 
            background: #000; 
            color: #fff; 
            font-family: Helvetica, Arial, sans-serif; 
            padding: 40px; 
            text-transform: uppercase; 
            margin: 0; 
            letter-spacing: 1px;
        }
        
        h1 { font-size: 14px; letter-spacing: 4px; margin-bottom: 30px; font-weight: 300; }

        /* GRID SYSTEM */
        .album-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 2px; 
            background: #fff; 
            border: 2px solid #fff; 
        }
        
        .album { 
            background: #000; 
            aspect-ratio: 1/1; 
            position: relative; 
            overflow: hidden; 
            background-position: center; 
            background-size: cover;
            filter: grayscale(100%); 
            transition: filter 0.5s ease, opacity 0.5s ease;
            opacity: 0.6;
        }

        .album:hover { 
            opacity: 1; 
            filter: grayscale(0%); 
        }

        /* OVERLAY PANEL */
        .album-info { 
            position: absolute; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.7); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            opacity: 0; 
            transition: opacity 0.4s ease-in-out; 
            pointer-events: none; 
            z-index: 2;
        }
        
        .album:hover .album-info { 
            opacity: 1; 
            pointer-events: auto; 
        }

        h2 { font-size: 16px; margin: 0 0 15px 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        /* TRACKLIST */
        .tracklist { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .tracklist li { 
            font-size: 10px; 
            padding: 12px 0; 
            border-bottom: 1px solid #222; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
        }
        .tracklist li:hover { background: #fff; color: #000; }

        /* ACTIVE STATUS DOT */
        .status-dot { 
            width: 6px; 
            height: 6px; 
            background: #ff0000; 
            border-radius: 50%; 
            display: none; 
            box-shadow: 0 0 8px #ff0000;
        }
        .playing .status-dot { 
            display: block; 
            animation: pulse 1.2s infinite ease-in-out; 
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        /* PROGRESS TIMER */
        .timer-container { width: 100%; height: 2px; background: #222; margin-top: auto; }
        .timer-bar { width: 0%; height: 100%; background: #fff; transition: width 0.1s linear; }
        
        /* INITIALIZE SCREEN */
        #unlocker { 
            position: fixed; 
            inset: 0; 
            background: #000; 
            z-index: 9999; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            transition: opacity 0.8s ease;
        }
    </style>
</head>

            [ INITIALIZE_SYSTEM ]
