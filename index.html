<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ezibeats Music Site</title>
    <style>

        background-image: url('VC-01.jpg');
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .album-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }
        .album {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
            transition: transform 0.2s;
        }
        .album:hover {
            transform: scale(1.05);
        }
        .album img {
            width: 100%;
            height: auto;
            display: block;
        }
        .album-info {
            padding: 10px;
            display: none;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            align-items: center;
            justify-content: center;
            display: flex;
            flex-direction: column;
        }
        .album:hover .album-info {
            display: flex;
        }
    </style>
</head>
<body>
    <h1>Ezibeats Album Collection</h1>
    <div class="album-grid">
        <div class="album">
            <img src="VC-01.jpg" alt="Album 1">
            <div class="album-info">
                <h2>Album Title 1</h2>
                <p>Track List:</p>
                <ul>
                    <li>Track 1</li>
                    <li>Track 2</li>
                    <li>Track 3</li>
                </ul>
            </div>
        </div>
        <div class="album">
            <img src="VC-01.jpg" alt="Album 2">
            <div class="album-info">
                <h2>Album Title 2</h2>
                <p>Track List:</p>
                <ul>
                    <li>Track 1</li>
                    <li>Track 2</li>
                    <li>Track 3</li>
                </ul>
            </div>
        </div>
        <!-- Add more album divs here... up to the 25th album -->
    </div>
</body>
</html>
