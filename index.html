<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZIBEATS_ARCHIVE_v04.6</title>
    <style>
        b<style>
    /* ... Keep your existing core styles (body, fonts) ... */

    /* 1. THE MAIN STACK */
    .page-container {
        display: flex; flex-direction: column;
        height: 100vh; width: 100vw;
        transition: all 0.8s cubic-bezier(0.85, 0, 0.15, 1);
    }

    /* 2. THE PANELS */
    .panel {
        flex: 1; border-bottom: 1px solid #fff;
        display: flex; align-items: center; justify-content: center;
        position: relative; overflow: hidden;
        transition: all 0.7s cubic-bezier(0.85, 0, 0.15, 1);
    }

    /* 3. THE TEXT LABEL (Moves to Top-Left on Click) */
    .panel h2 { 
        font-size: 8vw; font-weight: 900; pointer-events: none; 
        transition: all 0.5s ease; z-index: 10; 
    }

    /* 4. THE EXPANDED STATE (THE FIX) */
    .music-active .panel:nth-child(1) { 
        flex: 15; /* Expands much further */
        display: block; /* Disables flex centering to allow absolute centering of the grid */
    }

    .music-active .panel:nth-child(1) h2 { 
        font-size: 12px; position: absolute; top: 20px; left: 20px; 
        letter-spacing: 5px; pointer-events: auto; cursor: pointer;
    }

    /* 5. THE 3x3 GRID CONTAINER (CENTRALIZED) */
    #archive-content {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%); /* THE FIX: Forces center regardless of text */
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.6s ease, filter 0.6s ease;
        z-index: 50; /* Sits above everything */
    }

    .music-active #archive-content {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    /* 6. THE GRID & BLUR */
    .album-grid { 
        display: grid; grid-template-columns: repeat(3, 1fr); 
        gap: 2px; background: #fff; border: 1px solid #fff; width: 450px;
    }
    
    body.is-previewing #archive-content { filter: blur(25px) brightness(0.2); }
    
    .album { background: #000; aspect-ratio: 1/1; position: relative; background-size: cover; transition: 0.4s; }
    
    /* THE FOREFRONT POP */
    .album:hover { 
        transform: scale(1.2); z-index: 1000;
        filter: blur(0px) brightness(1.2); /* Break the blur */
    }
    
    /* ... Keep your existing album-info and tracklist CSS ... */
</style>

<body>
    <div class="page-container" id="master-stack">
        
        <div class="panel" onclick="this.parentElement.classList.add('music-active')">
            <h2 onclick="event.stopPropagation(); document.getElementById('master-stack').classList.remove('music-active')">
                MUSIC
            </h2>

            <div id="archive-content" onclick="event.stopPropagation()">
                <div class="album-grid">
                    <div class="album" style="background-image: url('project_1.jpg');" 
                         onmouseenter="document.body.classList.add('is-previewing')" 
                         onmouseleave="document.body.classList.remove('is-previewing'); stopPreview()">
                        <div class="album-info">
                            <h2>PRJ_001</h2>
                            <ul class="tracklist">
                                <li onmouseenter="startPreview('test1.mp3', this)">TRACK_01</li>
                                <li onmouseenter="startPreview('test2.mp3', this)">TRACK_02</li>
                            </ul>
                        </div>
                    </div>
                    <div class="album"></div><div class="album"></div>
                    <div class="album"></div><div class="album"></div><div class="album"></div>
                    <div class="album"></div><div class="album"></div><div class="album"></div>
                </div>
            </div>
        </div>

        <div class="panel"><h2>MERCH</h2></div>
        <div class="panel"><h2>SHOWS</h2></div>

    </div>
</body>
</html>
