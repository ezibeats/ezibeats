<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ezibeats</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background-color: #333; color: white; padding: 10px; text-align: center; }
        nav { margin: 20px; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .album { border: 1px solid #ccc; padding: 10px; text-align: center; }
        .btn { background-color: #5cb85c; color: white; border: none; padding: 10px; cursor: pointer; }
        .shows-table { width: 100%; border-collapse: collapse; }
        .shows-table th, .shows-table td { border: 1px solid #ddd; padding: 8px; }
        .shows-table th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Ezibeats</h1>
        <nav>
            <a href="#archive">Archive</a> |
            <a href="#shows">Shows</a>
        </nav>
    </header>
    <section id="archive">
        <h2>Archive</h2>
        <div class="grid">
            <!-- Sample album artwork items -->
            <div class="album"><img src="path/to/artwork1.jpg" alt="Album 1"><p>Album 1</p></div>
            <div class="album"><img src="path/to/artwork2.jpg" alt="Album 2"><p>Album 2</p></div>
            <!-- Repeat for 10 items -->
        </div>
        <div>
            <h3>Audio Playback</h3>
            <button class="btn" onclick="play('PROJECT010/A0000007.WAV')">Play Project 010</button>
            <button class="btn" onclick="play('PROJECT008/A0000007.WAV')">Play Project 008</button>
            <button class="btn" onclick="play('PROJECT003/A0000004.WAV')">Play Project 003</button>
        </div>
        <div>
            <a href="link_to_apple_music" target="_blank">Apple Music</a>
            <a href="link_to_bandcamp" target="_blank">Bandcamp</a>
        </div>
    </section>
    <section id="shows">
        <h2>Shows</h2>
        <table class="shows-table">
            <tr><th>Date</th><th>Venue</th><th>Location</th></tr>
            <!-- Sample show entries -->
            <tr><td>2023-05-01</td><td>Venue A</td><td>Location A</td></tr>
            <tr><td>2023-06-15</td><td>Venue B</td><td>Location B</td></tr>
            <!-- More entries -->
        </table>
    </section>
    <script>
        function switchView() { /* Logic here */ }
        function forceReset() { /* Logic here */ }
        function openItem(item) { /* Logic here */ }
        function closeAll() { /* Logic here */ }
        function play(file) { /* Logic to play audio */ }
        function updateTimer() { /* Update playback timer */ }
        function resetTimer() { /* Reset audio timer */ }
    </script>
</body>
</html>
