<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZIBEATS_ARCHIVE_v05.4</title>
    <style>
        body {
            margin: 0; padding: 20px;
            background: #000; color: #fff;
            font-family: 'Courier New', monospace;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Simplified Header */
        .ui-header { width: 100%; max-width: 900px; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .title { font-size: 14px; letter-spacing: 5px; font-weight: bold; }

        /* Responsive Grid */
        .archive-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 95vw;
            max-width: 900px;
        }

        .item {
            aspect-ratio: 1/1;
            background-color: #111;
            background-size: cover;
            background-position: center;
            position: relative;
            border: 1px solid #333;
            overflow: hidden;
            transition: 0.3s;
        }

        .item:hover { border-color: #ff0000; transform: scale(1.02); z-index: 10; }

        /* Hover Info */
        .info {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); opacity: 0; transition: 0.2s;
            display: flex; flex-direction: column; justify-content: center; padding: 15px; box-sizing: border-box;
        }

        .item:hover .info { opacity: 1; }

        .info h3 { margin: 0 0 10px; font-size: 12px; color: #ff0000; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .tracks { list-style: none; padding: 0; margin: 0; font-size: 10px; color: #888; }
        .tracks li:hover { color: #fff; cursor: pointer; }

    </style>
</head>
<body>

    <div class="ui-header">
        <div class="title">EZIBEATS_ARCHIVE // SYSTEM_ROLLBACK</div>
    </div>

    <div class="archive-grid">
        
        <div class="item" style="background-image: url('PROJECT_001/project_1.jpg');">
            <div class="info">
                <h3>[ PROJECT_001 ]</h3>
                <ul class="tracks">
                    <li onmouseenter="play('PROJECT_001/test1.mp3')">01_TRACK_01</li>
                    <li onmouseenter="play('PROJECT_001/test2.mp3')">02_TRACK_02</li>
                </ul>
            </div>
        </div>

        <div class="item" style="background-image: url('PROJECT_002/project_2.jpg');">
            <div class="info">
                <h3>[ PROJECT_002 ]</h3>
                <ul class="tracks">
                    <li onmouseenter="play('PROJECT_002/test4.mp3')">01_TRACK_04</li>
                    <li onmouseenter="play('PROJECT_002/test5.mp3')">02_TRACK_05</li>
                </ul>
            </div>
        </div>

        <div class="item" style="border: 1px dashed #222;"></div>

        <div class="item" style="background-image: url('PROJECT_004/project_4.jpg');">
            <div class="info">
                <h3>[ PROJECT_004 ]</h3>
                <ul class="tracks">
                    <li onmouseenter="play('PROJECT_004/test10.mp3')">01_TRACK_10</li>
                    <li onmouseenter="play('PROJECT_004/test11.mp3')">02_TRACK_11</li>
                    <li onmouseenter="play('PROJECT_004/test12.mp3')">03_TRACK_12</li>
                </ul>
            </div>
        </div>

        <div class="item" style="border: 1px dashed #111;"></div>
        <div class="item" style="border: 1px dashed #111;"></div>
        <div class="item" style="border: 1px dashed #111;"></div>
        <div class="item" style="border: 1px dashed #111;"></div>
        <div class="item" style="border: 1px dashed #111;"></div>

    </div>

    <script>
        let audio = null;
        function play(src) {
            if (audio) { audio.pause(); audio.currentTime = 0; }
            audio = new Audio(src);
            audio.play().catch(() => console.log("Click to enable sound"));
        }
        document.querySelector('.archive-grid').addEventListener('mouseleave', () => {
            if (audio) { audio.pause(); audio = null; }
        });
    </script>
</body>
</html>
