<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZIBEATS_ARCHIVE_v2.5</title>
    <style>
        /* --- SYSTEM CORE --- */
        :root {
            --bg-opacity: 0.9;
            --accent-red: #ff0000;
            --interface-grey: #111;
        }

        body, html { 
            margin: 0; padding: 0; background: #000; color: #fff; 
            font-family: 'Courier New', monospace; height: 100%; width: 100%;
            overflow: hidden; text-transform: uppercase;
        }

        /* --- LANDING STACK --- */
        #landing-page {
            display: flex; flex-direction: column; height: 100vh; width: 100vw;
            position: fixed; top: 0; left: 0; z-index: 5000;
            transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }
        body.view-active #landing-page { transform: translateY(-100%); }

        .pillar {
            flex: 1; width: 100%; display: flex; 
            justify-content: center; align-items: center;
            border-bottom: 1px solid var(--interface-grey); cursor: pointer;
            transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1); 
            background: rgba(0, 0, 0, var(--bg-opacity));
        }
        .pillar:hover { background: rgba(5, 5, 5, 1); flex: 1.5; }
        
        .nav-btn { 
            font-size: 28px; font-weight: 900; letter-spacing: 20px; 
            color: #1a1a1a; transition: 0.4s; pointer-events: none;
        }
        .pillar:hover .nav-btn { color: #fff; letter-spacing: 35px; }

        /* --- CONTENT VIEWS --- */
        .content-view { 
            display: none; width: 100%; height: 100vh; 
            position: relative; background: #000; overflow-y: auto; padding: 40px;
            box-sizing: border-box;
        }
        body.view-music #music-section, 
        body.view-shows #shows-section { display: block; }

        h1 { font-size: 14px; letter-spacing: 4px; margin-bottom: 30px; font-weight: 300; border-bottom: 2px solid #fff; padding-bottom: 10px; }

        /* --- MUSIC GRID SYSTEM --- */
        .album-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2px; background: #fff; border: 2px solid #fff;
        }
        
        .album {
            background: #000; aspect-ratio: 1/1; position: relative; overflow: hidden;
            background-position: center; background-size: cover;
            filter: grayscale(100%); transition: filter 0.5s ease, opacity 0.5s ease; opacity: 0.6;
        }
        .album:hover { opacity: 1; filter: grayscale(0%); z-index: 10; }

        .album-info {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 25px; display: flex; flex-direction: column;
            opacity: 0; transition: opacity 0.4s ease-in-out; pointer-events: none;
        }
        .album:hover .album-info { opacity: 1; pointer-events: auto; }
        
        h2 { font-size: 12px; margin: 0 0 15px 0; border-bottom: 1px solid #333; padding-bottom: 10px; letter-spacing: 2px; }
        
        .tracklist { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .tracklist li {
            font-size: 10px; padding: 12px 0; border-bottom: 1px solid #222;
            cursor: pointer; display: flex; align-items: center; justify-content: space-between;
            letter-spacing: 1px;
        }
        .tracklist li:hover { background: #fff; color: #000; }

        .status-dot { width: 6px; height: 6px; background: var(--accent-red); border-radius: 50%; display: none; box-shadow: 0 0 8px var(--accent-red); }
        .playing .status-dot { display: block; animation: pulse 1.2s infinite ease-in-out; }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .timer-container { width: 100%; height: 2px; background: #222; margin-top: auto; }
        .timer-bar { width: 0%; height: 100%; background: #fff; transition: width 0.1s linear; }

        /* --- SHOW HISTORY UI --- */
        .log-container { max-width: 900px; margin: 60px auto; }
        .show-row { 
            padding: 22px 0; display: flex; justify-content: space-between; 
            border-bottom: 1px solid #111; font-size: 10px; color: #444;
        }
        .date-cell { color: var(--accent-red); font-weight: 900; width: 140px; }
        
        .esc-btn { position: fixed; top: 40px; right: 40px; cursor: pointer; color: #444; font-size: 10px; z-index: 9999; letter-spacing: 2px; }
        .esc-btn:hover { color: #fff; }

        #unlocker {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: opacity 0.8s ease;
        }
    </style>
</head>
<body>

    <audio id="global-player"></audio>

    <div id="unlocker" onclick="this.style.opacity='0'; setTimeout(()=>{this.style.display='none'}, 800);">
        <div style="border: 1px solid #fff; padding: 30px; letter-spacing: 5px; font-size: 12px;">
            [ INITIALIZE_SYSTEM ]
        </div>
    </div>

    <div id="landing-page">
        <div class="pillar" onclick="switchView('music')"><div class="nav-btn">MUSIC_FILE</div></div>
        <div class="pillar" onclick="switchView('merch')"><div class="nav-btn">OBJECT_SAMPLES</div></div>
        <div class="pillar" onclick="switchView('shows')"><div class="nav-btn">SHOW_HISTORY</div></div>
    </div>

    <div id="music-section"
