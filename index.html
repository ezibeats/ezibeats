<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZIBEATS_ARCHIVE_v05.5</title>
    <style>
        body {
            margin: 0; 
            padding: 40px 20px;
            background: #000; 
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            /* SCROLL ENABLED */
            overflow-y: auto; 
            min-height: 100vh;
        }

        .ui-header { 
            width: 100%; 
            max-width: 800px; 
            margin-bottom: 30px; 
            border-bottom: 1px solid #222; 
            padding-bottom: 10px; 
        }

        .title { font-size: 13px; letter-spacing: 5px; font-weight: bold; text-transform: uppercase; }

        /* CONTROLLED GRID SIZE */
        .archive-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 800px; /* Limits how wide the grid can get */
        }

        .item {
            aspect-ratio: 1/1;
            background-color: #111;
            background-size: cover;
            background-position: center;
            position: relative;
            border: 1px solid #333;
            transition: 0.3s ease;
        }

        .item:hover { border-color: #ff0000; z-index: 10; transform: translateY(-5px); }

        /* HOVER OVERLAY */
        .info {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); 
            opacity: 0; 
            transition: 0.2s;
            display: flex; flex-direction: column; justify-content: center; 
            padding: 20px; box-sizing: border-box;
        }

        .item:hover .info { opacity: 1; }

        .info h3 { margin: 0 0 12px; font-size: 11px; color: #ff0000; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .tracks { list-style: none; padding: 0; margin: 0; }
        .tracks li {
            font-size: 9px;
            padding: 6px 0;
            color: #666;
            border-bottom: 1px solid #1a1a1a;
            cursor: crosshair;
        }
        .tracks li:hover { color: #fff; padding-left: 5px; }

        /* VISUAL PLACEHOLDER */
        .empty { border: 1px dashed #222; opacity: 0.3; }

    </style>
</head>
<body>

    <div class="ui-header">
        <div class="title">EZIBEATS_ARCHIVE // ACCESS_v05.5</div>
    </div>

    <div class="archive-grid">
        
        <div class="item" style="background-image: url('PROJECT_001/project_1.jpg');">
            <div class="info">
                <h3>[ PROJECT_001 ]</h3>
                <ul class="tracks">
                    <li onmouseenter="play('PROJECT_001/test1.mp3')">01_TRACK_01</li>
                    <li onmouseenter="play('PROJECT_001/test2.mp3')">02_TRACK_02</li>
                </ul>
            </div>
        </div>

        <div class="item" style="background-image: url('PROJECT_002/project_2.jpg');">
            <div class="info">
                <h3>[ PROJECT_002 ]</h3>
                <ul class="tracks">
                    <li onmouseenter="play('PROJECT_002/test4.mp3')">01_TRACK_04</li>
                    <li onmouseenter="play('PROJECT_002/test5.mp3')">02_TRACK_05</li>
                </ul>
            </div>
        </div>

        <div class="item empty"></div>

        <div class="item" style="background-image: url('PROJECT_004/project_4.jpg');">
            <div class="info">
                <h3>[ PROJECT_004 ]</h3>
                <ul class="tracks">
                    <li onmouseenter="play('PROJECT_004/test10.mp3')">01_TRACK_10</li>
                    <li onmouseenter="play('PROJECT_004/test11.mp3')">02_TRACK_11</li>
                    <li onmouseenter="play('PROJECT_004/test12.mp3')">03_TRACK_12</li>
                </ul>
            </div>
        </div>

        <div class="item empty"></div>
        <div class="item empty"></div>
        <div class="item empty"></div>
        <div class="item empty"></div>
        <div class="item empty"></div>

    </div>

    <script>
        let audio = null;
        function play(src) {
            if (audio) { audio.pause(); audio.currentTime = 0; }
            audio = new Audio(src);
            audio.play().catch(() => console.log("User must click page to enable audio"));
        }
        // Stops music when mouse leaves the entire grid
        document.querySelector('.archive-grid').addEventListener('mouseleave', () => {
            if (audio) { audio.pause(); audio = null; }
        });
    </script>
</body>
</html>
