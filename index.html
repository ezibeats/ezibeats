<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCH_WORLD_NEWS | ARCHIVE</title>
    <style>
        /* 1. GLOBAL SYSTEM & BACKGROUND */
        body {
            /* REPLACE 'background.jpg' WITH YOUR ART FILENAME */
            background-image: url('background.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #ffffff;
            background-blend-mode: overlay;
            
            color: #000000;
            font-family: "Helvetica", "Arial", sans-serif;
            margin: 0;
            padding: 40px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            line-height: 1.2;
        }

        header {
            margin-bottom: 60px;
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 {
            font-size: 18px;
            margin: 0;
            font-weight: 900;
        }

        .status-tag {
            font-size: 10px;
            background: #000;
            color: #fff;
            padding: 2px 6px;
        }

        /* 2. THE CLINICAL GRID */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2px;
            background-color: #000; 
            border: 2px solid #000;
            margin-bottom: 80px;
        }

        /* 3. ALBUM ITEM & FOCUS EFFECT */
        .album-item {
            background-color: rgba(255, 255, 255, 0.1); 
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            transition: opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0.5;
            border: 1px solid #000;
        }

        .album-grid:hover .album-item {
            opacity: 0.2; /* Dims everything else when browsing */
        }

        .album-item:hover {
            opacity: 1 !important;
            z-index: 10;
            background-color: #ffffff;
        }

        .album-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.4s ease;
        }

        .album-item:hover img {
            filter: grayscale(0%);
        }

        /* 4. LABELS (REVEAL ON HOVER) */
        .album-label {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #000;
            color: #fff;
            padding: 12px;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-sizing: border-box;
        }

        .album-item:hover .album-label {
            opacity: 1;
        }
