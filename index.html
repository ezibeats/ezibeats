<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZIBEATS_ARCHIVE_v01</title>
    <style>
        /* BASE INTERFACE */
        body {
            background-color: #000;
            color: #fff;
            font-family: "Helvetica", "Arial", sans-serif;
            margin: 0;
            padding: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden; /* Prevents scrollbars during hover */
        }

        #bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('VC-01.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
            transition: filter 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s ease;
        }

        body.is-previewing #bg-overlay { 
            filter: blur(50px) brightness(0.2); 
            transform: scale(1.1);
        }

        /* MASTER CONTROLS */
        #mute-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: none;
            border: 1px solid #fff;
            color: #fff;
            padding: 8px 12px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #mute-control:hover { background: #fff; color: #000; }
        #mute-control.is-muted { background: #ff0000; border-color: #ff0000; color: #fff; }

        #unlocker {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.6s ease;
        }

        .init-box {
            border: 1px solid #fff;
            padding: 30px;
            font-size: 11px;
            text-align: center;
            line-height: 2;
        }

        h1 { font-size: 14px; border-bottom: 2px solid #fff; padding-bottom: 10px; margin-bottom: 40px; font-weight: 900; }

        /* GRID ARCHITECTURE */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            background-color: #fff;
            border: 2px solid #fff;
        }

        .album {
            background-color: #000;
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            opacity: 0.3;
            transition: opacity 0.4s ease;
        }

        .album:hover { opacity: 1 !important; z-index: 10; }
        .album-grid:hover .album:not(:hover) { opacity: 0.05; }
        .album img { width: 100%; height: 100%; object-fit: cover; }

        /* TRACKLIST LAYER */
        .album-info {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
