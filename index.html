<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZIBEATS // 2x5_ARCHIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff0000; --bg: #000; --ui-grey: #1a1a1a; }
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; 
        }

        header { padding: 40px; border-bottom: 1px solid var(--ui-grey); }
        h1 { font-size: 40px; margin: 0; letter-spacing: -2px; }
        .sub { font-size: 10px; color: #666; letter-spacing: 4px; margin-top: 5px; }

        .container { padding: 40px; max-width: 1000px; margin: 0 auto; }
        .section-title { font-size: 11px; color: #444; margin: 60px 0 20px; border-left: 3px solid var(--accent); padding-left: 10px; }

        /* --- FORCED 2-COLUMN GRID --- */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* FORCES 2 COLUMNS */
            gap: 20px;
        }

        .project-card {
            position: relative; background: #050505;
            border: 1px solid var(--ui-grey); overflow: hidden; cursor: pointer;
        }

        .project-card img {
            width: 100%; aspect-ratio: 1/1; object-fit: cover;
            display: block; filter: grayscale(100%);
            transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .project-card:hover img { filter: grayscale(0%); transform: scale(1.05); }

        .project-label {
            position: absolute; bottom: 10px; left: 10px;
            font-size: 9px; background: rgba(0,0,0,0.8); padding: 2px 5px;
            color: #fff; border: 1px solid var(--ui-grey);
        }

        /* --- MANIFEST --- */
        .manifest-table { width: 100%; border-collapse: collapse; margin-bottom: 80px; }
        .manifest-table td { padding: 15px 10px; font-size: 10px; border-bottom: 1px solid var(--ui-grey); color: #666; }
        .date { width: 110px; color: var(--accent); font-weight: bold; }

        @media (max-width: 700px) {
            .project-grid { grid-template-columns: 1fr; } /* Stacks on mobile for readability */
        }
    </style>
</head>
<body>

    <header>
        <h1>EZIBEATS</h1>
        <div class="sub">TECHNICAL_ARCHIVE // 10_PROJECT_SYNC</div>
    </header>

    <div class="container">
        
        <div class="section-title">PROJECT_ARCHIVE // 2x5_MATRIX</div>
        <div class="project-grid">
            <div class="project-card"><img src="PROJECT010/untitled_23.jpg"><div class="project-label">P_010</div></div>
            <div class="project-card"><img src="PROJECT008/discussion2.jpg"><div class="project-label">P_008</div></div>
            
            <div class="project-card"><img src="PROJECT007/image.jpg"><div class="project-label">P_007</div></div>
            <div class="project-card"><img src="PROJECT006/image.jpg"><div class="project-label">P_006</div></div>

            <div class="project-card"><img src="PROJECT005/image.jpg"><div class="project-label">P_005</div></div>
            <div class="project-card"><img src="PROJECT004/image.jpg"><div class="project-label">P_004</div></div>

            <div class="project-card"><img src="PROJECT003/image.jpg"><div class="project-label">P_003</div></div>
            <div class="project-card"><img src="PROJECT_002/image.jpg"><div class="project-label">P_002</div></div>

            <div class="project-card"><img src="PROJECT_001/image.jpg"><div class="project-label">P_001</div></div>
            <div class="project-card"><img src="album 1/image.jpg"><div class="project-label">ALBUM_01</div></div>
        </div>

        <div class="section-title">PERFORMANCE_MANIFEST</div>
        <table class="manifest-table">
            <tbody id="manifest-body"></tbody>
        </table>

    </div>

    <script>
        const shows = [
            { d: "MAY 20 20", l: "ONLINE_SHOWCASE_v1.0" },
            { d: "MAR 07 20", l: "RED_SEA (MPLS)" },
            { d: "JAN 15 20", l: "7TH_ST_ENTRY (MPLS)" },
            { d: "DEC 31 19", l: "DECADE_END @ RED SEA" },
            { d: "NOV 15 19", l: "CAYDENCE_RECORDS (STP)" },
            { d: "SEP 20 19", l: "PALMERS_BAR (MPLS)" },
            { d: "AUG 15 19", l: "PART WOLF (MPLS)" },
            { d: "JAN 12 19", l: "RED_SEA_RESIDENCY" },
            { d: "APR 21 18", l: "PAISLEY_PARK (CHANHASSEN)" },
            { d: "JAN 09 16", l: "SYSTEM_START" }
        ];

        const tableBody = document.getElementById('manifest-body');
        shows.forEach(show => {
            tableBody.innerHTML += `<tr><td class="date">${show.d}</td><td>${show.l}</td></tr>`;
        });
    </script>
</body>
</html>
