<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EZIBEATS_ARCHIVE_v02_STABLE</title>
    <style>
        body { 
            background: #000; color: #fff; font-family: Helvetica, Arial, sans-serif; 
            padding: 40px; text-transform: uppercase; margin: 0; letter-spacing: 1px;
        }
        h1 { font-size: 14px; letter-spacing: 4px; margin-bottom: 30px; border-bottom: 2px solid #fff; padding-bottom: 10px; }

        /* THE GRID */
        .album-grid { 
            display: grid; grid-template-columns: repeat(5, 1fr); 
            gap: 2px; background: #fff; border: 2px solid #fff; 
        }
        
        .album { 
            background: #000; aspect-ratio: 1/1; position: relative; overflow: hidden; 
            background-position: center; background-size: cover;
            filter: grayscale(100%); transition: 0.5s; opacity: 0.6;
        }

        .album:hover { opacity: 1; filter: grayscale(0%); z-index: 10; }

        /* THE HOVER PANEL */
        .album-info { 
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.9); 
            padding: 20px; display: flex; flex-direction: column; 
            opacity: 0; transition: 0.3s; pointer-events: none; 
        }
        
        .album:hover .album-info { opacity: 1; pointer-events: auto; }
        h2 { font-size: 12px; margin: 0 0 10px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .tracklist { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .tracklist li { 
            font-size: 10px; padding: 10px 0; border-bottom: 1px solid #222; 
            cursor: pointer; display: flex; align-items: center; justify-content: space-between;
        }
        .tracklist li:hover { background: #fff; color: #000; }

        /* PULSING STATUS DOT */
        .status-dot { width: 6px; height: 6px; background: #ff0000; border-radius: 50%; display: none; }
        .playing .status-dot { display: block; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        
        /* PROGRESS BAR */
        .timer-container { width: 100%; height: 2px; background: #222; margin-top: auto; }
        .timer-bar { width: 0%; height: 100%; background: #fff; }
        
        /* INITIALIZE SYSTEM BOX */
        #unlocker { 
            position: fixed; inset: 0; background: #000; z-index: 9999; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <div id="unlocker" onclick="this.style.display='none';">
        <div style="border: 1px solid #fff; padding: 25px; letter-spacing: 3px;">[ INITIALIZE_SYSTEM ]</div>
    </div>

    <h1>EZIBEATS // ARCHIVE_V02</h1>

    <div class="album-grid">
        
        <div class="album" style="background-image: url('project_1.jpg');" onmouseleave="stopPreview()">
            <div class="album-info">
                <h2>PROJECT_001</h2>
                <ul class="tracklist">
                    <li onmouseenter="startPreview('test1.mp3', this)">TEST_01 <span class="status-dot"></span></li>
                    <li onmouseenter="startPreview('test2.mp3', this)">TEST_02 <span class="status-dot"></span></li>
                    <li onmouseenter="startPreview('test3.mp3', this)">TEST_03 <span class="status-dot"></span></li>
                </ul>
                <div class="timer-container"><div class="timer-bar"></div></div>
            </div>
        </div>

        <div class="album" style="background-image: url('project_2.jpg');" onmouseleave="stopPreview()">
            <div class="album-info">
                <h2>PROJECT_002</h2>
                <ul class="tracklist">
                    <li onmouseenter="startPreview('test4.mp3', this)">TEST_04 <span class="status-dot"></span></li>
                    <li onmouseenter="startPreview('test5.mp3', this)">TEST_05 <span class="status-dot"></span></li>
                    <li onmouseenter="startPreview('test6.mp3', this)">TEST_06 <span class="status-dot"></span></li>
                </ul>
                <div class="timer-container"><div class="timer-bar"></div></div>
            </div>
        </div>

        <div class="album" style="background-image: url('project_3.jpg');" onmouseleave="stopPreview()">
            <div class="album-info">
                <h2>PROJECT_003</h2>
                <ul class="tracklist">
                    <li onmouseenter="startPreview('test7.mp3', this)">TEST_07 <span class="status-dot"></span></li>
                    <li onmouseenter="startPreview('test8.mp3', this)">TEST_08 <span class="status-dot"></span></li>
                    <li onmouseenter="startPreview('test9.mp3', this)">TEST_09 <span class="status-dot"></span></li>
                </ul>
                <div class="timer-container"><div class="timer-bar"></div></div>
            </div>
        </div>
        
        <div class="album"></div><div class="album"></div>
    </div>

    <audio id="global-player"></audio>

    <script>
        const player = document.getElementById('global-player');
        let barInterval;

        function startPreview(file, element) {
            clearInterval(barInterval);
            document.querySelectorAll('.timer-bar').forEach(b => b.style.width = "0%");
            document.querySelectorAll('.tracklist li').forEach(li => li.classList.remove('playing'));
            
            element.classList.add('playing');
            const album = element.closest('.album');
            const timerBar = album.querySelector('.timer-bar');

            player.pause();
            player.src = './' + file; // Unified root path
            player.play().catch(e => console.log("System initialization required."));

            let progress = 0;
            barInterval = setInterval(() => {
                progress += 0.5; 
                if(timerBar) timerBar.style.width = progress + "%";
                if (progress >= 100) stopPreview();
            }, 100);
        }

        function stopPreview() {
            clearInterval(barInterval);
            player.pause();
            player.src = "";
            document.querySelectorAll('.timer-bar').forEach(b => b.style.width = "0%");
            document.querySelectorAll('.tracklist li').forEach(li => li.classList.remove('playing'));
        }
    </script>
</body>
</html>
