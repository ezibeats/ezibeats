<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZIBEATS_ARCHIVE_v06.92</title>
    <style>
        /* --- CORE SYSTEM --- */
        body {
            margin: 0; padding: 0;
            background: #000; color: #fff;
            font-family: 'Courier New', monospace;
            overflow-x: hidden; min-height: 100vh;
        }

        /* --- LANDING PAGE: HORIZONTAL STACK --- */
        #landing-page {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            z-index: 1000; background: #000;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .section-panel {
            flex: 1; width: 100%;
            border-bottom: 1px solid #222;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
        }

        .section-panel:last-child { border-bottom: none; }

        .nav-btn {
            font-size: 60px; letter-spacing: 15px;
            color: #1a1a1a; transition: 0.4s ease;
            font-weight: 900; text-transform: uppercase;
        }

        .section-panel:hover { background: #050505; flex: 1.4; }
        .section-panel:hover .nav-btn { 
            color: #ff0000; 
            letter-spacing: 25px; 
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.4); 
        }

        .panel-bg-text { position: absolute; bottom: 15px; right: 20px; font-size: 9px; color: #111; letter-spacing: 2px; }

        /* --- MODULE VISIBILITY --- */
        #archive-section, #merch-section, #shows-section {
            display: none; opacity: 0;
            flex-direction: column; align-items: center;
            padding: 60px 20px;
            min-height: 100vh;
        }

        body.view-active #landing-page { 
            opacity: 0; 
            visibility: hidden; 
            pointer-events: none; 
        }
        
        body.view-music #archive-section { display: flex; opacity: 1; }
        body.view-merch #merch-section { display: flex; opacity: 1; }
        body.view-shows #shows-section { display: flex; opacity: 1; }

        /* --- UI ELEMENTS --- */
        .ui-header { width: 100%; max-width: 800px; margin-bottom: 30px; border-bottom: 1px solid #222; padding-bottom: 10px; display: flex; justify-content: space-between; }
        .title { font-size: 11px; letter-spacing: 5px; font-weight: bold; }
        #timer { font-size: 11px; color: #ff0000; font-variant-numeric: tabular-nums; }

        .archive-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 800px; }
        .item { aspect-ratio: 1/1; background-color: #111; background-size: cover; background-position: center; position: relative; border: 1px solid #333; cursor: pointer; }
        .item.active { border-color: #fff; }
        
        .info { position: absolute; inset: 0; background: rgba(0,0,0,0.95); opacity: 0; transition: 0.2s; display: flex; flex-direction: column; justify-content: center; padding: 20px; pointer-events: none; }
        .item.active .info { opacity: 1; pointer-events: auto; }
        
        .tracks { list-style: none; padding: 0; margin: 0; }
        .tracks li { font-size: 10px; padding: 8px 0; color: #666; border-bottom: 1px solid #1a1a1a; cursor: crosshair; }
        .tracks li.playing { color: #ff0000; font-weight: bold; }
