<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ezíbeats - Music Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">🎵 Ezíbeats</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#tracks">Tracks</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="container">
            <h1>Welcome to Ezíbeats</h1>
            <p>Original music, protected and secure</p>
        </div>
    </section>

    <section id="tracks" class="tracks">
        <div class="container">
            <h2>My Tracks</h2>
            <div class="track-grid" id="trackGrid">
                <!-- Tracks will be loaded here -->
            </div>
        </div>
    </section>

    <section id="about" class="about">
        <div class="container">
            <h2>About</h2>
            <p>Ezíbeats creates original, high-quality music. All tracks are protected with secure streaming technology.</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Ezíbeats. All rights reserved.</p>
    </footer>

    <!-- Music Player Modal -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="trackTitle"></h2>
            <audio id="audioPlayer" controls>
                <source id="audioSource" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <div class="player-info">
                <p id="trackInfo"></p>
            </div>
        </div>
    </div>

    <script src="js/protection.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
