<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Grid</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .album-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }
        .album {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .album img {
            width: 100%;
            border-radius: 10px;
        }
        .album:hover {
            transform: scale(1.05);
        }
        .track-list {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 10px;
        }
        .album:hover .track-list {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Album Grid</h1>
    <div class="album-grid">
        <div class="album">
            <img src="album1.jpg" alt="Album 1">
            <div class="track-list">
                <h3>Album 1</h3>
                <ul>
                    <li>Track 1</li>
                    <li>Track 2</li>
                </ul>
                <audio controls>
                    <source src="track1.mp3" type="audio/mpeg">
                    Your browser does not support the audio tag.
                </audio>
            </div>
        </div>
        <div class="album">
            <img src="album2.jpg" alt="Album 2">
            <div class="track-list">
                <h3>Album 2</h3>
                <ul>

                </ul>
                <audio controls>
                    <source src="track2.mp3" type="audio/mpeg">
                    Your browser does not support the audio tag.
                </audio>
            </div>
        </div>
        <div class="album">
            <img src="album3.jpg" alt="Album 3">
            <div class="track-list">
                <h3>Album 3</h3>
                <ul>
                    <li>Track 1</li>
                    <li>Track 2</li>
                </ul>
                <audio controls>
                    <source src="track3.mp3" type="audio/mpeg">

            </div>
        </div>
        <div class="album">

    </div>
</body>
</html>
